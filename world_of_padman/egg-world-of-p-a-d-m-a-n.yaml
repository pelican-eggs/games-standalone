scripts:
  installation:
    script: |-
      #!/bin/bash
      # World of PADMAN Installation Script


      cd /mnt/server

      ## get release info and download links
      LATEST_JSON=$(curl --silent "https://api.github.com/repos/PadWorld-Entertainment/worldofpadman/releases/latest")
      RELEASES=$(curl --silent "https://api.github.com/repos/PadWorld-Entertainment/worldofpadman/releases")

      if [ -z "${VERSION}" ] || [ "${VERSION}" == "latest" ]; then
          DOWNLOAD_URL=$(echo ${LATEST_JSON} | jq .assets | jq -r .[].browser_download_url | grep -i unified.zip)
      else
          VERSION_CHECK=$(echo ${RELEASES} | jq -r --arg VERSION "${VERSION}" '.[] | select(.tag_name==$VERSION) | .tag_name')
          if [ "${VERSION}" == "${VERSION_CHECK}" ]; then
              DOWNLOAD_URL=$(echo ${RELEASES} | jq -r --arg VERSION "${VERSION}" '.[] | select(.tag_name==$VERSION) | .assets[].browser_download_url' | grep -i unified.zip)
          else
              echo -e "defaulting to latest release"
              DOWNLOAD_URL=$(echo ${LATEST_JSON} | jq .assets | jq -r .[].browser_download_url)
          fi
      fi

      echo "Downloading from ${DOWNLOAD_URL}..."
      curl -sSL ${DOWNLOAD_URL} -o wop.zip

      echo "Extracting files..."
      unzip -q -o wop.zip
      rm wop.zip

      # 2. Permissions & Architecture Symlink
      echo "Setting up executables..."
      chmod +x wopded.*

      ARCH=$(uname -m)
      if [ "$ARCH" == "aarch64" ] || [ "$ARCH" == "arm64" ]; then
          ln -sf wopded.aarch64 wopded
      elif [ "$ARCH" == "x86_64" ] || [ "$ARCH" == "amd64" ]; then
          ln -sf wopded.x86_64 wopded
      else
          ln -sf wopded.x86 wopded
      fi

      # 3. Generate Config
      mkdir -p ${FS_GAME}

      echo "Generating ${FS_GAME}/${SERVER_CONFIG}..."
      cat << EOF > ${FS_GAME}/${SERVER_CONFIG}
      //
      //    World of PADMAN - Panel generated server settings
      //

      // Server name and message
      set sv_hostName "${SERVER_HOSTNAME}"
      set g_MOTD      "Welcome to World of PADMAN!"

      // Server settings
      set sv_maxClients "12"
      set sv_VoIP       "1"
      set sv_maxRate    "9000"

      // Download Settings
      set sv_allowdownload "${ALLOW_DOWNLOAD}"

      // Bot settings
      set bot_enable     "1"
      set bot_minPlayers "4"
      set g_spSkill      "2"

      // Passwords
      set rconPassword "${RCON_PASSWORD}"
      set g_password   ""

      // Game settings
      set g_allowVote "1"
      set g_doWarmup  "1"
      set g_warmup    "30"

      // Execution of map rotation
      exec "rotation.cfg"

      // Fallback map just in case rotation fails
      map wop_padgarden
      EOF

      echo "Installation complete!"
    container: 'ghcr.io/pelican-eggs/installers:debian'
    entrypoint: bash
variables:
  -
    name: 'Allow Downloads'
    description: '1 = Allow players to download maps from the server. 0 = Disable.'
    env_variable: ALLOW_DOWNLOAD
    default_value: 1
    user_viewable: true
    user_editable: true
    rules:
      - required
      - boolean
    sort: 1
  -
